name: Check and build iOS
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true
env:
  EXPO_NO_TELEMETRY: '1'
  CI: '1'
jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm run check
      - name: Check release publishing
        working-directory: .
        run: python3 -m unittest discover -s tools/tests -v
      - run: npm run check:widgets
      - run: npm run build:web
      - uses: actions/upload-artifact@v4
        with:
          name: Yudu-web-preview
          path: mobile/dist
          retention-days: 14
  ios:
    needs: check
    runs-on: macos-26
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install dependencies
        run: npm ci --prefix mobile
      - name: Check native widget storage
        run: node mobile/node_modules/tsx/dist/cli.mjs tools/check-widget-storage.ts
      - name: Generate iOS project
        working-directory: mobile
        run: npx expo prebuild --platform ios --no-install
      - name: Install native dependencies
        working-directory: mobile/ios
        run: pod install
      - name: Build unsigned app
        run: bash tools/build-ios.sh
      - name: Verify application and widget package
        run: python3 tools/validate-ipa.py
      - uses: actions/upload-artifact@v4
        with:
          name: Yudu-unsigned-IPA
          path: artifacts/Yudu-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
